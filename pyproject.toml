[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bartissk1-ansipeek"
version = "0.1.0"
description = "拆解终端 ANSI 转义序列，还原纯文本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bartissk1" }]
keywords = ["ansi", "terminal", "escape", "logs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/bartissk1/ansipeek"
Repository = "https://github.com/bartissk1/ansipeek"
Issues = "https://github.com/bartissk1/ansipeek/issues"

[project.scripts]
ansipeek = "ansipeek:main"

[tool.setuptools]
py-modules = ["ansipeek"]
